name: gym-jf

services:
  db:
    build: ./docker/mysql
    image: gym-jf-mysql
    container_name: gym_jf_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASSWORD:-gymjf_dev}
      MYSQL_DATABASE: gym_jf
      TZ: UTC
    ports:
      # 3307 en el host porque el 3306 suele estar ocupado por un MySQL local.
      # Workbench: host 127.0.0.1, puerto 3307, usuario root, contraseña DOCKER_DB_PASSWORD.
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - gym_jf_data:/var/lib/mysql
      # Los scripts se ejecutan en orden alfabetico, solo la primera vez (volumen vacio).
      - "./docs/TCU Gimnacio JF/TCU Gimnacio JF/SQL/DB_Gym_JF.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"
      - "./docs/TCU Gimnacio JF/TCU Gimnacio JF/SQL/Indices y Triggers.sql:/docker-entrypoint-initdb.d/02-indices-triggers.sql:ro"
      - "./docs/TCU Gimnacio JF/TCU Gimnacio JF/SQL/Procedimientos almacenados y Trasacciones.sql:/docker-entrypoint-initdb.d/03-procedimientos.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: .
    container_name: gym_jf_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/gym_jf?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-gymjf_dev}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en backend/.env}
    ports:
      - "8080:8080"

volumes:
  gym_jf_data:
