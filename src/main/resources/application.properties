# Nombre de la aplicación
spring.application.name=backend

# Carga variables locales desde .env (no versionado; ver .env.example)
spring.config.import=optional:file:.env[.properties]

# Puerto donde correrá la API REST
server.port=8080

# Conexión a la Base de Datos MySQL (Database: gym_jf)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
# Usamos 'none' o 'validate' porque los scripts SQL, tablas, índices y triggers ya los creaste manualmente
spring.jpa.hibernate.ddl-auto=validate

# Muestra los tipos de dialecto de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Perfiles: "dev" por defecto (consultas SQL en consola y Swagger abierto).
# En producción activar SPRING_PROFILES_ACTIVE=prod (ver application-prod.properties).
spring.profiles.default=dev

# CORS: orígenes web permitidos (lista separada por comas). Vacío = ninguno. Ver CorsConfig.
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Paginación de los listados: tamaño máximo de página
spring.data.web.pageable.max-page-size=100

# Actuator: solo se expone /actuator/health (lo usa el healthcheck de Docker)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Una caída del proveedor de correo no debe marcar el backend como DOWN
management.health.mail.enabled=false

# Configuración de JWT
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=2592000000

# Manejo de errores: nunca exponer el stack trace al cliente (DevTools lo activa por defecto).
# Los errores de la API se responden como ProblemDetail desde GlobalExceptionHandler.
spring.web.error.include-stacktrace=never

# Primer administrador (solo se crea si no existe ningún ADMIN y ambas variables están definidas)
application.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
application.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
application.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:Administrador Gym JF}

# Correo (recuperación de contraseña). false = simulado (se escribe en el log en dev).
# true = envío real por SMTP; el proveedor elegido es Brevo (ver .env.example).
application.mail.enabled=${MAIL_ENABLED:false}
application.mail.from=${MAIL_FROM:no-reply@gymjf.local}
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Enlace que va en el correo de recuperación (la app/web que recibirá el código)
application.frontend.reset-url=${FRONTEND_RESET_URL:http://localhost:3000/restablecer-contrasena}
