# Nombre de la aplicación
spring.application.name=backend

# Carga variables locales desde .env (no versionado; ver .env.example)
spring.config.import=optional:file:.env[.properties]

# Puerto donde correrá la API REST
server.port=8080

# Conexión a la Base de Datos MySQL (Database: gym_jf)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
# Usamos 'none' o 'validate' porque los scripts SQL, tablas, índices y triggers ya los creaste manualmente
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Muestra los tipos de dialecto de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración de JWT
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=2592000000